//file:noinspection SpellCheckingInspection
//file:noinspection GroovyAssignabilityCheck
plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[7.0.17,8)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${jar_name}-forge"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

minecraft {
    runs {
        configureEach {
            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
        }

        register('client') {
            workingDir = layout.projectDirectory.dir('run/client')
        }

        register('server') {
            workingDir = layout.projectDirectory.dir('run/server')
            args '--nogui'
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    minecraft.mavenizer(it) // In Kotlin, it = this
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency('net.minecraftforge:forge:26.1.2-64.0.4')
    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.1'
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version         : minecraft_version,
            minecraft_version_range   : minecraft_version_range,
            forge_loader_version_range: forge_loader_version_range,
            forge_version             : forge_version,
            forge_version_range       : forge_version_range,
            mod_id                    : mod_id,
            mod_name                  : mod_name,
            mod_author                : mod_author,
            mod_version               : mod_version,
            mod_icon                  : mod_icon,
            mod_license               : mod_license,
            mod_description           : mod_description,
            mod_repo                  : mod_repo,
            project_version           : project.version,
            project_group             : project.group
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}